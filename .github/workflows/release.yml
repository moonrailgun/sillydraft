name: Release

# Pushed by ./release.sh. Packaging runs alongside verify; the draft release
# is published only when verify passed and every platform built, so update
# checks (GitHub's “latest release”, which skips drafts) never offer a
# partial or untested release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  create:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create draft release
        run: |
          version=$(sed -nE 's/^version: *([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+ *$/\1/p' pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 pubspec.yaml 的版本 $version 不一致"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then exit 0; fi
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            if [ -n "$prev" ]; then
              git log --no-merges --format='- %s' "$prev..$GITHUB_REF_NAME" | grep -v '^- chore(release):' || true
            else
              echo '首个发布版本。'
            fi
            cat <<'EOF'

          ### 安装

          - Android：下载 APK 安装，仅支持 64 位 ARM（arm64-v8a）设备。
          - macOS：解压后把 SillyDraft 拖进“应用程序”。应用未经 Apple 公证，首次打开时在“系统设置 › 隐私与安全性”中选择“仍要打开”，或执行 `xattr -dr com.apple.quarantine /Applications/SillyDraft.app`。
          - Windows：解压后运行 `sillydraft.exe`，保留整个目录。
          - Linux：解压后运行 `sillydraft`，需要桌面密钥环（Secret Service）。
          EOF
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "SillyDraft $version" --notes-file notes.md

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-24.04
          - target: macos
            os: macos-15
          - target: windows
            os: windows-2025
          - target: linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - if: matrix.target == 'android'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev
      - run: flutter pub get --enforce-lockfile
      - run: echo "ASSET=dist/sillydraft-${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV" && mkdir dist

      - if: matrix.target == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SILLYDRAFT_STORE_PASSWORD: ${{ secrets.SILLYDRAFT_STORE_PASSWORD }}
          SILLYDRAFT_KEY_ALIAS: ${{ secrets.SILLYDRAFT_KEY_ALIAS }}
          SILLYDRAFT_KEY_PASSWORD: ${{ secrets.SILLYDRAFT_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo '::error::缺少 Secret ANDROID_KEYSTORE_BASE64，见 docs/building.md 的“发布”'
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          # arm64 only: every ABI added ~30 MB of uncompressed native libraries.
          SILLYDRAFT_KEYSTORE="$RUNNER_TEMP/upload.jks" flutter build apk --release --target-platform android-arm64
          mv build/app/outputs/flutter-apk/app-release.apk "$ASSET-android.apk"

      - if: matrix.target == 'macos'
        run: |
          flutter build macos --release
          ditto -c -k --keepParent build/macos/Build/Products/Release/SillyDraft.app "$ASSET-macos.zip"

      # Windows ships the whole Release directory plus the MSVC runtime, which
      # a fresh Windows may lack.
      - if: matrix.target == 'windows'
        shell: pwsh
        run: |
          flutter build windows --release
          Copy-Item build/windows/x64/runner/Release SillyDraft -Recurse
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR/System32/$dll" SillyDraft
          }
          Compress-Archive -Path SillyDraft -DestinationPath "$env:ASSET-windows-x64.zip"

      - if: matrix.target == 'linux'
        run: |
          flutter build linux --release
          cp -R build/linux/x64/release/bundle SillyDraft
          tar -czf "$ASSET-linux-x64.tar.gz" SillyDraft

      - run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  publish:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
