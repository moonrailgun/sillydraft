name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart pub get --enforce-lockfile
        working-directory: packages/sillydraft_core
      - run: dart pub get --enforce-lockfile
        working-directory: server
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver tool packages/sillydraft_core/lib packages/sillydraft_core/test server/lib server/bin server/test
      - run: flutter analyze
      - run: dart test --reporter expanded
        working-directory: packages/sillydraft_core
      - run: flutter test test --reporter expanded
      - run: dart test --reporter expanded
        working-directory: server

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos
          - os: windows-2025
            target: windows
          - os: ubuntu-24.04
            target: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ${{ matrix.target }} --release
      - if: runner.os == 'macOS'
        run: xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Debug -destination 'platform=macOS' test
      - if: runner.os == 'macOS'
        run: python3 tool/verify_macos_atomic_export.py

  mobile:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: flutter pub get --enforce-lockfile
      # Keep native builds sequential: Flutter rewrites shared plugin registrants.
      - run: flutter build ios --simulator --debug
      - run: flutter build apk --release
        env:
          SILLYDRAFT_DEVELOPMENT_SIGNING: 'true'
